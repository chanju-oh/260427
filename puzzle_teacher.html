<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방탈출 실시간 관제 센터</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #111; color: #fff; font-family: 'Malgun Gothic', sans-serif; padding: 30px; text-align: center; }
        h1 { color: #f0c987; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .card { background: #222; border: 3px solid #444; border-radius: 15px; padding: 30px 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); transition: 0.3s; }
        .card.success { border-color: #4ade80; background: #06200c; transform: scale(1.05); }
        .group-name { font-size: 1.8em; color: #fff; font-weight: bold; margin-bottom: 15px; }
        .status { font-size: 1.5em; color: #4ade80; font-weight: bold; }
        button { margin-top: 60px; padding: 15px 30px; background: #555; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1.1em; }
        button:hover { background: #ff6b6b; }
    </style>
</head>
<body>
    <h1>🛰️ 조형사 방탈출 실시간 현황판</h1>
    <div class="grid" id="dashboard"></div>
    <button onclick="resetData()">🔄 데이터 초기화 (다음 반 준비)</button>

    <script>
        // ★ 이 부분을 선생님의 파이어베이스 설정값으로 변경하세요 ★
        const firebaseConfig = {
            apiKey: "AIzaSyALlQNFjwj6YFOHbdSfsNdnAoYje3HpHL4",
            authDomain: "art-funding.firebaseapp.com",
            databaseURL: "https://art-funding-default-rtdb.firebaseio.com",
            projectId: "art-funding",
            storageBucket: "art-funding.firebasestorage.app",
            messagingSenderId: "976837369403",
            appId: "1:976837369403:web:8c71defb3a8919cc82c61e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('escapeStatus').on('value', (snapshot) => {
            const data = snapshot.val();
            const dashboard = document.getElementById('dashboard');
            dashboard.innerHTML = '';
            
            if(!data) return;

            Object.keys(data).forEach(group => {
                const info = data[group];
                const isClear = info.stage === "🎉 탈출 성공!";
                const card = document.createElement('div');
                card.className = `card ${isClear ? 'success' : ''}`;
                card.innerHTML = `
                    <div class="group-name">${group}</div>
                    <div class="status">${info.stage}</div>
                `;
                dashboard.appendChild(card);
            });
        });

        function resetData() {
            if(confirm("모든 조의 기록을 삭제하고 초기화할까요?")) {
                db.ref('escapeStatus').remove();
            }
        }
    </script>
</body>
</html>
